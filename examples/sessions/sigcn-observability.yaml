recap:
  attendees: 16
  points:
    - title: Logs menjawab apa yang terjadi
      body: Pakai format terstruktur seperti JSON supaya gampang dicari dan difilter.
    - title: Metrics menjawab seberapa sering dan seberapa lama
      body: Angka agregat itu murah disimpan, dan cocok untuk dashboard dan alert.
    - title: Traces menjawab di mana waktunya habis
      body: Satu request diikuti lintas service, jadi bagian yang lambat kelihatan.
    - title: OpenTelemetry memisahkan instrumentasi dari backend
      body: Kode diinstrumentasi sekali, datanya bisa dikirim ke backend apa saja yang mendukung OTLP.
    - title: Alert pada gejala yang dirasakan pengguna
      body: Contohnya error rate dan latency. CPU tinggi sebentar belum tentu masalah.
