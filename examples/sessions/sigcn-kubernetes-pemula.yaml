  points:
    - title: Pod adalah unit terkecil yang dijadwalkan
      body: Satu Pod bisa berisi satu atau beberapa container yang berbagi network dan storage.
    - title: Deployment menjaga jumlah replika
      body: Kalau sebuah Pod mati, Deployment membuat penggantinya supaya jumlah replika sesuai yang diminta.
    - title: Service memberi alamat yang stabil
      body: IP Pod berubah setiap kali dibuat ulang, jadi akses aplikasi lewat Service, bukan lewat IP Pod.
    - title: Mulai debug dari kubectl describe dan logs
      body: Event di describe dan output logs biasanya sudah cukup untuk menemukan penyebab Pod gagal jalan.
