description: >-
  SIG CN itu grup FORA untuk ngobrol soal menjalankan aplikasi di cloud (cloud native).
  Contohnya aplikasi yang tiba-tiba lambat dan harus dicari penyebabnya, atau deploy yang
  bikin semuanya mogok. Tiap sesi satu tema, misalnya Kubernetes atau GitOps, di voice
  channel Discord. Satu orang cerita, yang lain nimbrung atau nanya.
