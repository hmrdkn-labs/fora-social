description: "Kacabenggala Editions adalah arsip nonkomersial yang memulihkan dan menata ulang buku, esai, dan artikel yang sudah tidak dicetak. Andre ngobrol soal cara arsipnya dibuat: OCR untuk mengambil teks dari scan buku lama, dan LaTeX untuk menata ulang halamannya."
topics:
  - "OCR: mengambil teks dari hasil scan buku lama"
  - "LaTeX: menata ulang halaman supaya rapi dibaca di layar"
  - Arsip nonkomersial untuk karya yang sudah tidak dicetak
  - Unduhan PDF dan EPUB, dari Demokrasi Kita (1960) sampai Oslan Husein (1963)
  - Ilalang, proyek saudara untuk puisi dan cerpen
