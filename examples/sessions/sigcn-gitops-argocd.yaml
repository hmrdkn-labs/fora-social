sig: sig-cn
series: Cloud Native 101
theme: GitOps
title: GitOps dengan Argo CD
subtitle: Deploy lewat merge pull request, Git dasar sudah cukup
problem: Deploy masih lewat perintah manual, dan nggak ada yang yakin apa yang sebenarnya jalan di server sekarang.
date: "2026-12-19"
time: "19:30"
durationMinutes: 90
voiceChannel: sig-cn-voice
host:
  name: Rina (contoh)
  role: Platform Engineer
  about: Rina menyiapkan repo kosong berisi manifest (file YAML yang menjelaskan aplikasi di cluster) dan Argo CD, lalu alurnya dibangun bareng dari nol.
speakers:
  - name: Dani (contoh)
    role: SRE
    about: Tim Dani dulu deploy dengan kubectl apply manual, dan dia cerita kenapa akhirnya pindah ke GitOps.
note: Pernah ada yang kubectl apply langsung ke prod jam 11 malam? Di tim saya pernah, dan dari situ saya pindah ke GitOps.
description: Bayangkan deploy cukup dengan merge pull request, dan cluster otomatis ikut isi repo Git. Kita bangun alurnya dari nol pakai Argo CD, jadi yang belum pernah pakai GitOps juga bisa ikut. Cukup tahu Git dasar.
topics:
  - Prinsip GitOps
  - Argo CD Application dan sync
  - Struktur repo manifest
  - Rollback pakai git revert
hashtags:
  - ArgoCD
  - DevOps
recap:
  attendees: 11
  question: Bagian mana dari alur tadi yang masih bikin bingung, atau kalau sudah pernah rollback, caranya lewat apa?
  points:
    - title: Git jadi source of truth
      body: Kondisi yang diinginkan ditulis di repo, dan controller yang menyamakan cluster dengan repo. Tidak ada kubectl apply manual.
    - title: Argo CD membandingkan live state dengan Git
      body: Kalau beda, aplikasi berstatus OutOfSync, dan sync menerapkan perubahannya.
    - title: Pisahkan repo manifest dari repo kode aplikasi
      body: Manifest, file YAML yang menjelaskan aplikasi di cluster, tinggal di repo sendiri. Perubahan konfigurasi tidak ikut memicu build, dan histori deploy lebih rapi.
    - title: Rollback config cukup dengan git revert
      body: Revert commit yang mengubah manifest, lalu sync, dan riwayatnya tetap tercatat. Batasnya, migrasi database tidak ikut mundur, jadi itu dipikirkan terpisah.
  links:
    - label: Dokumentasi Argo CD
      url: https://argo-cd.readthedocs.io/
