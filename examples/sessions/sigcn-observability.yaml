theme: Observability
title: "Observability: Logs, Metrics, Traces"
subtitle: Aplikasinya lambat, dan ke mana kita cari jawabannya
date: "2027-01-14"
time: "20:00"
durationMinutes: 90
voiceChannel: sig-cn-voice
host:
  name: Rina (contoh)
  role: Platform Engineer
  about: Memandu, dan nanya duluan, terakhir kali aplikasimu lambat, kamu mulai cari dari mana?
speakers:
  - name: Eko (contoh)
    role: SRE
    about: Membedah satu kasus aplikasi lambat dan menunjukkan dari mana dia mulai mencari.
note: Pernah aplikasi lambat, dashboard hijau semua, dan nggak ada yang tahu mulai cari dari mana? Sesi ini mulai dari situ.
description: Aplikasi jalan tapi lambat, dan kita nggak tahu kenapa. Kita lihat apa yang dijawab logs (catatan kejadian), metrics (angka seperti lama respons) dan traces (jalur satu request), dan cara mulai tanpa memasang semuanya sekaligus.
topics:
  - Monitoring vs observability
  - Logs terstruktur
  - Metrics dan Prometheus, alat pengumpul metrics
  - Distributed tracing
  - OpenTelemetry, satu kode untuk banyak backend
  - Alert yang nggak bikin capek
hashtags:
  - OpenTelemetry
  - Prometheus
recap:
  attendees: 16
  question: Kalau aplikasi proyekmu lambat, kamu mau mulai cari dari log atau dari metrics?
  points:
    - title: Log yang terstruktur bisa dicari
      body: Dengan format seperti JSON, field seperti duration_ms bisa disaring, jadi request yang lambat gampang ditemukan di aplikasi lambat tadi.
    - title: Metrics itu angka murah yang tahan lama
      body: Jumlah request dan lama respons ringan disimpan berbulan-bulan, jadi cocok untuk dashboard dan alert.
    - title: Trace menunjuk service mana yang menghabiskan waktu
      body: Satu request diikuti dari service ke service, lalu bagian yang lambat kelihatan.
    - title: OpenTelemetry, pasang kode pencatat sekali
      body: Datanya dikirim lewat OTLP, format standar OpenTelemetry untuk mengirim data, jadi backend-nya bisa diganti tanpa mengubah kode aplikasi.
    - title: Alert dari yang dirasakan pengguna
      body: Error rate dan latency yang jadi patokan. CPU tinggi sebentar belum tentu masalah.
  links:
    - label: Dokumentasi OpenTelemetry
      url: https://opentelemetry.io/docs/
    - label: Dokumentasi Prometheus
      url: https://prometheus.io/docs/introduction/overview/
