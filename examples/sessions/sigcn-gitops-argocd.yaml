recap:
  attendees: 11
  points:
    - title: Git adalah sumber kebenaran
      body: Kondisi yang diinginkan ditulis di repo; controller yang menyamakan cluster dengan repo, bukan orang yang menjalankan kubectl apply.
    - title: Argo CD membandingkan live state dengan Git
      body: Kalau berbeda, aplikasi berstatus OutOfSync, dan sync akan menerapkan perubahan.
    - title: Pisahkan repo manifest dari repo kode aplikasi
      body: Dengan begitu perubahan konfigurasi tidak ikut memicu build, dan histori deploy lebih bersih.
    - title: Rollback adalah git revert
      body: Commit baru yang membatalkan perubahan lalu disinkronkan, jadi riwayatnya tetap tercatat.
