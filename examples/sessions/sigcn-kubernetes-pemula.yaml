description: Sesi pertama Cloud Native 101. Di minikube, cluster Kubernetes di laptop, kita deploy satu aplikasi lalu matikan Pod-nya dan lihat Deployment membuat gantinya. Dari situ baru kita kenalan sama istilahnya. Cukup tahu apa itu container.
