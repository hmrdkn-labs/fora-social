recap:
  attendees: 14
  question: Deployment membuat Pod pengganti sendiri. Waktu proses aplikasimu mati, siapa atau apa yang menyalakannya lagi?
  points:
    - title: Pod adalah unit terkecil yang dijadwalkan
      body: Satu Pod bisa berisi beberapa container yang berbagi network dan storage.
    - title: Deployment menjaga jumlah replika
      body: Kalau satu Pod mati, Deployment langsung membuat gantinya sampai jumlah replika sesuai.
    - title: Service memberi alamat yang stabil
      body: IP Pod berubah tiap kali dibuat ulang, jadi akses aplikasi lewat Service. Jangan pakai IP Pod langsung.
    - title: Mulai debug dari kubectl describe dan logs
      body: Event di describe dan output logs biasanya sudah cukup untuk tahu kenapa Pod gagal jalan.
