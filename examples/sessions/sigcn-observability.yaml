recap:
  attendees: 16
  points:
    - title: Logs menjawab apa yang terjadi
      body: Pakai format terstruktur seperti JSON supaya mudah dicari dan difilter.
    - title: Metrics menjawab seberapa sering dan seberapa lama
      body: Angka agregat yang murah disimpan dan cocok untuk dashboard dan alert.
    - title: Traces menjawab di mana waktunya habis
      body: Satu request diikuti lintas service, sehingga bagian yang lambat terlihat jelas.
    - title: OpenTelemetry memisahkan instrumentasi dari backend
      body: Kode diinstrumentasi sekali, lalu data bisa dikirim ke backend mana pun yang mendukung OTLP.
    - title: Alert pada gejala yang dirasakan pengguna
      body: Contohnya error rate dan latency, bukan CPU yang kebetulan tinggi sebentar.
